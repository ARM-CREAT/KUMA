<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KUMA</title>
<meta name="theme-color" content="#075E54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
:root {
  --kuma-green: #075E54;
  --kuma-green-light: #128C7E;
  --kuma-accent: #25D366;
  --kuma-bg: #ece5dd;
  --kuma-bg-dark: #0b141a;
  --kuma-panel: #f0f0f0;
  --kuma-bubble-out: #d9fdd3;
  --kuma-bubble-in: #ffffff;
  --kuma-text: #111b21;
  --kuma-muted: #667781;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--kuma-bg);
  color: var(--kuma-text);
  overscroll-behavior: none;
}
img { max-width: 100%; }
button { font-family: inherit; cursor: pointer; }

#app { display: flex; flex-direction: column; height: 100vh; max-width: 520px; margin: 0 auto; background: #fff; position: relative; overflow: hidden; }

/* ---------- Écrans d'authentification ---------- */
.auth-screen {
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  height: 100%; padding: 32px; background: var(--kuma-green); color: #fff; text-align: center;
}
.auth-screen h1 { font-size: 42px; margin-bottom: 4px; letter-spacing: 1px; }
.auth-screen p.tagline { opacity: .85; margin-bottom: 32px; }
.auth-screen input, .auth-screen select {
  width: 100%; padding: 14px; border-radius: 8px; border: none; margin-bottom: 12px; font-size: 16px;
}
.auth-screen button.primary {
  width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--kuma-accent);
  color: #063; font-weight: 600; font-size: 16px; margin-top: 8px;
}
.auth-screen .lang-select { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
.auth-screen .lang-select button {
  padding: 6px 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; font-size: 13px;
}
.auth-screen .lang-select button.active { background: #fff; color: var(--kuma-green); border-color: #fff; }
#recaptcha-container { margin-top: 8px; }
.hidden { display: none !important; }

/* ---------- Barre supérieure ---------- */
.top-bar {
  background: var(--kuma-green); color: #fff; padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.top-bar h2 { margin: 0; font-size: 20px; font-weight: 600; }
.top-bar .icons { display: flex; gap: 18px; font-size: 18px; }

/* ---------- Onglets (Discussions / Statuts / Communautés / Appels) ---------- */
.tabs {
  display: flex; background: var(--kuma-green); flex-shrink: 0;
}
.tabs button {
  flex: 1; background: none; border: none; color: rgba(255,255,255,.7);
  padding: 12px 0; font-size: 13px; border-bottom: 3px solid transparent;
}
.tabs button.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }

/* ---------- Filtres ---------- */
.filters { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; flex-shrink: 0; background: #fff; border-bottom: 1px solid #eee; }
.filters button { padding: 6px 14px; border-radius: 16px; border: 1px solid #ddd; background: #f6f6f6; font-size: 13px; white-space: nowrap; }
.filters button.active { background: var(--kuma-green); color: #fff; border-color: var(--kuma-green); }

/* ---------- Panneaux (scroll) ---------- */
.panel { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.panel::-webkit-scrollbar { width: 4px; }

/* ---------- Liste de discussions ---------- */
.chat-item { display: flex; align-items: center; padding: 10px 14px; gap: 12px; border-bottom: 1px solid #f0f0f0; }
.chat-item:active { background: #f5f5f5; }
.avatar {
  width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--kuma-green-light), var(--kuma-accent));
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; flex-shrink: 0; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-item .meta { flex: 1; min-width: 0; }
.chat-item .row1 { display: flex; justify-content: space-between; }
.chat-item .name { font-weight: 600; font-size: 16px; }
.chat-item .time { font-size: 12px; color: var(--kuma-muted); }
.chat-item .row2 { display: flex; justify-content: space-between; align-items: center; }
.chat-item .last-msg { font-size: 13px; color: var(--kuma-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.chat-item .badge { background: var(--kuma-accent); color: #fff; font-size: 11px; border-radius: 10px; padding: 2px 7px; min-width: 18px; text-align: center; }

.empty-state { text-align: center; color: var(--kuma-muted); padding: 60px 24px; font-size: 14px; }

/* ---------- Bouton flottant ---------- */
.fab {
  position: absolute; right: 18px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
  background: var(--kuma-accent); color: #fff; border: none; font-size: 26px; box-shadow: 0 3px 8px rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center;
}

/* ---------- Écran de conversation ---------- */
.chat-screen { position: absolute; inset: 0; background: var(--kuma-bg); display: flex; flex-direction: column; z-index: 20; }
.chat-header { background: var(--kuma-green); color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.chat-header .back { font-size: 22px; background: none; border: none; color: #fff; }
.chat-header .info { flex: 1; display: flex; flex-direction: column; }
.chat-header .info .name { font-weight: 600; }
.chat-header .info .status { font-size: 12px; opacity: .8; }
.chat-header .actions { display: flex; gap: 16px; font-size: 18px; }

.messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 78%; padding: 7px 10px; border-radius: 8px; font-size: 14.5px; position: relative; line-height: 1.35; cursor: pointer; }
.msg:active { filter: brightness(0.97); }
.msg.out { align-self: flex-end; background: var(--kuma-bubble-out); border-top-right-radius: 0; }
.msg.in { align-self: flex-start; background: var(--kuma-bubble-in); border-top-left-radius: 0; }
.msg .msg-time { display: block; font-size: 10.5px; color: var(--kuma-muted); text-align: right; margin-top: 3px; }
.msg audio { width: 220px; height: 36px; }

.composer { display: flex; align-items: center; gap: 8px; padding: 8px; background: #f0f0f0; flex-shrink: 0; }
.composer input[type=text] { flex: 1; border: none; border-radius: 20px; padding: 11px 16px; font-size: 15px; }
.composer button { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--kuma-green); color: #fff; font-size: 18px; flex-shrink: 0; }
.composer button.recording { background: #e74c3c; }

/* ---------- Statuts ---------- */
.status-list-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
.status-ring { width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--kuma-accent); padding: 2px; flex-shrink: 0; }
.status-ring.seen { border-color: #ccc; }
.status-ring .avatar { width: 100%; height: 100%; }
.section-label { padding: 8px 14px; font-size: 13px; color: var(--kuma-green); font-weight: 600; background: #fafafa; }

/* ---------- Appels ---------- */
.call-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
.call-item .call-icon { color: var(--kuma-muted); font-size: 18px; }
.call-item .call-icon.missed { color: #e74c3c; }

/* ---------- Écran d'appel ---------- */
.call-screen {
  position: absolute; inset: 0; background: var(--kuma-bg-dark); color: #fff; z-index: 30;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px;
}
.call-screen .avatar { width: 120px; height: 120px; font-size: 40px; }
.call-screen video#remoteVideo { width: 100%; flex: 1; border-radius: 12px; object-fit: cover; background: #000; }
.call-screen video#localVideo { position: absolute; top: 16px; right: 16px; width: 100px; border-radius: 8px; border: 2px solid #fff; }
.call-controls { display: flex; gap: 24px; margin-top: 20px; }
.call-controls button { width: 56px; height: 56px; border-radius: 50%; border: none; background: rgba(255,255,255,.15); color: #fff; font-size: 20px; }
.call-controls button.end { background: #e74c3c; }

.call-grid { flex: 1; width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; overflow-y: auto; }
.call-tile { position: relative; background: #1c1c1c; border-radius: 10px; overflow: hidden; min-height: 120px; }
.call-tile video { width: 100%; height: 100%; object-fit: cover; }
.call-tile span { position: absolute; bottom: 6px; left: 8px; color: #fff; font-size: 12px; background: rgba(0,0,0,.5); padding: 2px 6px; border-radius: 4px; }

/* ---------- Modales ---------- */
.modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; z-index: 40; }
.modal-sheet { background: #fff; width: 100%; border-radius: 16px 16px 0 0; padding: 20px; max-height: 80%; overflow-y: auto; }
.modal-sheet h3 { margin-top: 0; }
.modal-sheet input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 12px; }
.modal-sheet button.primary { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--kuma-green); color: #fff; font-weight: 600; }
.contact-pick { display: flex; align-items: center; gap: 10px; padding: 8px 0; }

.toast {
  position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 50;
}
</style>
</head>
<body>
<div id="app">

  <!-- ===================== AUTHENTIFICATION ===================== -->
  <div id="authScreen" class="auth-screen">
    <h1>KUMA</h1>
    <p class="tagline" id="authTagline">Discutez librement, où que vous soyez</p>

    <div class="lang-select">
      <button data-lang="fr">Français</button>
      <button data-lang="bm">Bamanankan</button>
      <button data-lang="ff">Fulfulde</button>
      <button data-lang="sn">Soninkanxanne</button>
      <button data-lang="tm">Tamasheq</button>

    <div id="step-code" class="hidden">

  <!-- ===================== APPLICATION PRINCIPALE ===================== -->
  <div id="mainApp" class="hidden" style="display:flex;flex-direction:column;height:100%">

      <div class="icons">
        <span>🔍</span>
        <span id="menuBtn">⋮</span>
      </div>
    </div>

    <div class="tabs">
      <button data-tab="chats" class="active">Discussions</button>
      <button data-tab="status">Statuts</button>
      <button data-tab="communities">Communautés</button>
      <button data-tab="calls">Appels</button>
    </div>

    <!-- --- Discussions --- -->
    <div id="panel-chats" class="tab-panel" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="filters">
        <button class="active" data-filter="all">Toutes</button>
        <button data-filter="unread">Non lues</button>

    <!-- --- Communautés (à venir) --- -->

      <div class="empty-state">Les communautés arrivent bientôt.</div>
    </div>

    <!-- --- Appels --- -->
    <div id="panel-calls" class="tab-panel hidden panel" id="callsTabContent"></div>

  </div>

  <!-- ===================== ÉCRAN DE CONVERSATION ===================== -->
  <div id="chatScreen" class="chat-screen hidden">
    <div class="chat-header">
      <button class="back" id="backBtn">←</button>
      <div class="avatar" style="width:38px;height:38px;font-size:14px" id="chatHeaderAvatar">?</div>
      <div class="info">
        <span class="name" id="chatHeaderName">Discussion</span>
        <span class="status" id="chatHeaderStatus">en ligne</span>
      </div>
      <div class="actions">
        <span onclick="callFromChatHeader(false)">📞</span>
        <span onclick="callFromChatHeader(true)">🎥</span>
        <span id="chatInfoBtn">ℹ️</span>
      </div>
    </div>
    <div id="pinnedBanner" class="hidden" style="background:#fff9db;padding:8px 14px;font-size:13px;border-bottom:1px solid #eee;display:flex;gap:6px;align-items:center"></div>
    <div class="messages" id="messagesList"></div>
    <div id="replyBar" class="hidden" style="display:flex;align-items:center;gap:8px;background:#f0f0f0;padding:8px 12px;border-top:1px solid #ddd"></div>
    <div class="composer">
      <button id="attachBtn">📎</button>
      <input type="file" id="imageInput" accept="image/*" class="hidden">
      <input type="text" id="messageInput" placeholder="Message">
      <button id="voiceBtn">🎤</button>
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <!-- ===================== ÉCRAN D'APPEL ===================== -->
  <div id="callScreen" class="call-screen hidden">
    <video id="remoteVideo" autoplay playsinline class="hidden"></video>
    <video id="localVideo" autoplay playsinline muted class="hidden"></video>

      <div class="avatar" id="callPeerAvatar">?</div>

    <h2 id="callPeerName">Contact</h2>

    </div>

  <!-- ===================== MODALES ===================== -->
  <div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this) closeModal()">

  <div id="toast" class="toast hidden"></div>
</div>

<script>

//    → ajouter votre domaine Vercel (ex: kuma-beta.vercel.app)

const firebaseConfig = {

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// Cache local pour le mode faible consommation / offline
db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
  console.warn("Persistence Firestore non activée :", err.code);
});

// Serveur TURN pour les appels audio/vidéo (WebRTC) — compte gratuit
// à créer sur https://www.metered.ca/tools/openrelay/ ou https://dashboard.metered.ca/

<script>
// ============================================================
// KUMA — Authentification par numéro de téléphone (OTP Firebase)
// ============================================================

let confirmationResult = null;
let selectedLang = localStorage.getItem("kuma_lang") || "fr";

const I18N = {
  fr: { welcome: "Discutez librement, où que vous soyez", send: "Envoyer le code", verify: "Vérifier", name: "Votre nom" },
  bm: { welcome: "Kuma hɔrɔnya la, yɔrɔ o yɔrɔ i bɛ", send: "Kodo ci", verify: "Lajɛ", name: "I tɔgɔ" },
  ff: { welcome: "Wowlu hino, e nokku fof", send: "Neldu kod", verify: "Ƴeewndo", name: "Innde maa" },
  sn: { welcome: "Kaaya diina, yi kaŋ", send: "Kod moxu", verify: "Xayma", name: "I tuurax" },
  tm: { welcome: "Iwal daɣ tenaɣt", send: "Azn awal", verify: "Sasat", name: "Isem-nnek" }
};

function setLang(lang) {
  selectedLang = lang;
  localStorage.setItem("kuma_lang", lang);
  document.querySelectorAll(".lang-select button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  const t = I18N[lang] || I18N.fr;
  document.getElementById("authTagline").textContent = t.welcome;
  document.getElementById("sendCodeBtn").textContent = t.send;
  document.getElementById("verifyCodeBtn").textContent = t.verify;
  document.getElementById("displayName").placeholder = t.name;
}

function setupRecaptcha() {
  if (window.recaptchaVerifier) return;
  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier("recaptcha-container", {
    size: "invisible"
  });
}

async function sendOtp() {
  const phone = document.getElementById("phoneInput").value.trim();
  if (!phone.startsWith("+")) {
    showToast("Utilisez le format international, ex : +223 70 00 00 00");
    return;
  }
  setupRecaptcha();
  try {
    confirmationResult = await auth.signInWithPhoneNumber(phone, window.recaptchaVerifier);
    document.getElementById("step-phone").classList.add("hidden");
    document.getElementById("step-code").classList.remove("hidden");
  } catch (err) {
    console.error(err);
    showToast("Échec de l'envoi du code : " + err.message);
    window.recaptchaVerifier.render().then((id) => grecaptcha.reset(id));
  }
}

async function verifyOtp() {
  const code = document.getElementById("codeInput").value.trim();
  const name = document.getElementById("displayName").value.trim() || "Utilisateur KUMA";
  if (!confirmationResult) return;
  try {
    const result = await confirmationResult.confirm(code);
    const user = result.user;
    await db.collection("users").doc(user.uid).set({
      uid: user.uid,
      phone: user.phoneNumber,
      name,
      lang: selectedLang,
      photoURL: "",
      about: "Disponible",
      lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
      online: true
    }, { merge: true });
    // onAuthStateChanged (plus bas) prend le relais pour afficher l'app
  } catch (err) {
    console.error(err);
    showToast("Code invalide, réessayez.");
  }
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 2500);
}

document.addEventListener("DOMContentLoaded", () => {
  setLang(selectedLang);
  document.querySelectorAll(".lang-select button").forEach(b => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });
  document.getElementById("sendCodeBtn").addEventListener("click", sendOtp);
  document.getElementById("verifyCodeBtn").addEventListener("click", verifyOtp);
});
</script>

<script>
// ============================================================
// KUMA — Cœur de l'application : navigation, liste de discussions,
// groupes, présence en ligne, blocage, confidentialité
// ============================================================

let currentUser = null;
let chatsUnsub = null;
let usersUnsub = null;
let activeFilter = "all";
let allUsers = [];
let myProfile = {};

auth.onAuthStateChanged((user) => {
  if (user) {
    currentUser = user;
    db.collection("users").doc(user.uid).update({
      online: true,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {});
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    initUsersList();
    initChatsList();
    initStatusTab();
    initCallsTab();
  } else {
    currentUser = null;
    document.getElementById("authScreen").classList.remove("hidden");
    document.getElementById("mainApp").classList.add("hidden");
    if (chatsUnsub) chatsUnsub();
    if (usersUnsub) usersUnsub();
  }
});

window.addEventListener("beforeunload", () => {
  if (currentUser) {
    db.collection("users").doc(currentUser.uid).update({
      online: false,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {});
  }
});

// ---------- Présence : liste des utilisateurs en temps réel ----------
function initUsersList() {
  usersUnsub = db.collection("users").limit(200).onSnapshot((snap) => {
    allUsers = snap.docs.map(d => d.data());
    myProfile = allUsers.find(u => u.uid === currentUser.uid) || {};
    renderChatsList(); // rafraîchit les puces "en ligne" dans la liste
    if (typeof updateChatHeaderStatus === "function" && activeChatId) updateChatHeaderStatus();
  });
}

function isBlockedPair(uidA, uidB) {
  const a = allUsers.find(u => u.uid === uidA);
  const b = allUsers.find(u => u.uid === uidB);
  return !!((a && (a.blockedUsers || []).includes(uidB)) || (b && (b.blockedUsers || []).includes(uidA)));
}

// ---------- Navigation par onglets ----------
function switchTab(tab) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("hidden", p.id !== "panel-" + tab));
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".tabs button").forEach(b => {
    b.addEventListener("click", () => switchTab(b.dataset.tab));
  });
  document.querySelectorAll(".filters button").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".filters button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      activeFilter = b.dataset.filter;
      renderChatsList();
    });
  });
  document.getElementById("fabNewChat").addEventListener("click", openNewChatModal);
  document.getElementById("menuBtn").addEventListener("click", openMenu);
  document.getElementById("chatInfoBtn").addEventListener("click", openChatInfo);
});

// ---------- Liste des discussions (temps réel) ----------
let allChats = [];

function initChatsList() {
  chatsUnsub = db.collection("chats")
    .where("members", "array-contains", currentUser.uid)
    .orderBy("lastMessageAt", "desc")
    .onSnapshot((snap) => {
      allChats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderChatsList();
    }, (err) => console.error("Erreur liste discussions:", err));
}

function renderChatsList() {
  const container = document.getElementById("chatsList");
  let chats = allChats;
  if (activeFilter === "unread") chats = chats.filter(c => (c.unread && c.unread[currentUser.uid] > 0));
  if (activeFilter === "groups") chats = chats.filter(c => c.isGroup);
  if (activeFilter === "favorites") chats = chats.filter(c => (c.favorites || []).includes(currentUser.uid));

  if (chats.length === 0) {
    container.innerHTML = `<div class="empty-state">Aucune discussion pour le moment.<br>Touchez + pour en démarrer une.</div>`;
    return;
  }

  container.innerHTML = chats.map(c => {
    const otherName = chatDisplayNameSafe(c);
    const unreadCount = (c.unread && c.unread[currentUser.uid]) || 0;
    const time = c.lastMessageAt ? formatTime(c.lastMessageAt.toDate()) : "";
    const initials = (otherName || "?").slice(0, 2).toUpperCase();
    const other = !c.isGroup ? allUsers.find(u => u.uid === otherUid(c)) : null;
    const onlineDot = other && other.online ? `<span style="position:absolute;width:12px;height:12px;background:var(--kuma-accent);border:2px solid #fff;border-radius:50%;margin-left:36px;margin-top:36px"></span>` : "";
    return `
      <div class="chat-item" onclick="openChat('${c.id}')">
        <div style="position:relative"><div class="avatar">${initials}</div>${onlineDot}</div>
        <div class="meta">
          <div class="row1"><span class="name">${escapeHtml(otherName || "Discussion")}</span><span class="time">${time}</span></div>
          <div class="row2">
            <span class="last-msg">${escapeHtml(c.lastMessage || "")}</span>
            ${unreadCount > 0 ? `<span class="badge">${unreadCount}</span>` : ""}
          </div>
        </div>
      </div>`;
  }).join("");
}

function chatDisplayNameSafe(c) {
  return c.isGroup ? c.name : (c.namesByUid ? c.namesByUid[otherUid(c)] : "Contact");
}

function otherUid(chat) {
  return (chat.members || []).find(u => u !== currentUser.uid);
}

function formatTime(date) {
  const now = new Date();
  const sameDay = date.toDateString() === now.toDateString();
  if (sameDay) return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return date.toLocaleDateString([], { day: "2-digit", month: "2-digit" });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

// ---------- Nouvelle discussion / nouveau groupe ----------
function openNewChatModal() {
  const users = allUsers.filter(u => u.uid !== currentUser.uid && !isBlockedPair(currentUser.uid, u.uid));
  const list = users.map(u => `
    <div class="contact-pick" onclick="startDirectChat('${u.uid}','${escapeHtml(u.name)}')">
      <div class="avatar">${(u.name || "?").slice(0,2).toUpperCase()}</div>
      <div>
        <div style="font-weight:600">${escapeHtml(u.name)}</div>
        <div style="font-size:12px;color:var(--kuma-muted)">${escapeHtml(u.phone || "")}</div>
      </div>
    </div>`).join("");
  showModal(`
    <h3>Nouvelle discussion</h3>
    <button class="primary" style="margin-bottom:14px;background:var(--kuma-accent)" onclick="openNewGroupModal()">👥 Nouveau groupe</button>
    <div>${list || "<p>Aucun autre utilisateur KUMA trouvé pour le moment.</p>"}</div>
  `);
}

async function startDirectChat(otherUid, otherName) {
  closeModal();
  const existing = allChats.find(c => !c.isGroup && (c.members || []).includes(otherUid));
  if (existing) { openChat(existing.id); return; }
  const ref = await db.collection("chats").add({
    isGroup: false,
    members: [currentUser.uid, otherUid],
    namesByUid: { [currentUser.uid]: currentUser.displayName || myProfile.name || "Moi", [otherUid]: otherName },
    lastMessage: "",
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    unread: { [currentUser.uid]: 0, [otherUid]: 0 },
    disappearingDuration: 0
  });
  openChat(ref.id);
}

function openNewGroupModal() {
  const users = allUsers.filter(u => u.uid !== currentUser.uid);
  const checks = users.map(u => `
    <label class="contact-pick">
      <input type="checkbox" value="${u.uid}" data-name="${escapeHtml(u.name)}" class="group-member-check">
      <div class="avatar">${(u.name||"?").slice(0,2).toUpperCase()}</div>
      <div>${escapeHtml(u.name)}</div>
    </label>`).join("");
  showModal(`
    <h3>Nouveau groupe</h3>
    <input type="text" id="groupNameInput" placeholder="Nom du groupe">
    <div style="max-height:240px;overflow-y:auto">${checks}</div>
    <button class="primary" onclick="createGroup()">Créer le groupe</button>
  `);
}

async function createGroup() {
  const name = document.getElementById("groupNameInput").value.trim();
  const checked = Array.from(document.querySelectorAll(".group-member-check:checked"));
  if (!name || checked.length === 0) { showToast("Nom du groupe et au moins un membre requis"); return; }
  const members = [currentUser.uid, ...checked.map(c => c.value)];
  const unread = {}; members.forEach(m => unread[m] = 0);
  const ref = await db.collection("chats").add({
    isGroup: true,
    name,
    members,
    admins: [currentUser.uid],
    lastMessage: "Groupe créé",
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    unread,
    disappearingDuration: 0
  });
  closeModal();
  openChat(ref.id);
}

// ---------- Info discussion (épinglés, messages éphémères, blocage) ----------
function openChatInfo() {
  if (!activeChat) return;
  const isGroup = activeChat.isGroup;
  const otherUidVal = !isGroup ? otherUid(activeChat) : null;
  const blocked = otherUidVal ? (myProfile.blockedUsers || []).includes(otherUidVal) : false;

  showModal(`
    <h3>${escapeHtml(chatDisplayNameSafe(activeChat))}</h3>
    ${isGroup ? `<p style="color:var(--kuma-muted)">${activeChat.members.length} membres</p>` : ""}

    <div style="margin:14px 0">
      <label style="font-weight:600;display:block;margin-bottom:6px">Messages éphémères</label>
      <select id="disappearingSelect" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd">
        <option value="0" ${!activeChat.disappearingDuration ? "selected" : ""}>Désactivés</option>
        <option value="86400" ${activeChat.disappearingDuration === 86400 ? "selected" : ""}>24 heures</option>
        <option value="604800" ${activeChat.disappearingDuration === 604800 ? "selected" : ""}>7 jours</option>
        <option value="7776000" ${activeChat.disappearingDuration === 7776000 ? "selected" : ""}>90 jours</option>
      </select>
      <button class="primary" style="margin-top:8px" onclick="saveDisappearing()">Enregistrer</button>
    </div>

    ${!isGroup ? `
      <button class="primary" style="background:${blocked ? "var(--kuma-accent)" : "#e74c3c"}" onclick="toggleBlock('${otherUidVal}')">
        ${blocked ? "Débloquer ce contact" : "Bloquer ce contact"}
      </button>` : ""}
  `);
}

async function saveDisappearing() {
  const val = parseInt(document.getElementById("disappearingSelect").value, 10);
  await db.collection("chats").doc(activeChatId).update({ disappearingDuration: val });
  closeModal();
  showToast(val ? "Messages éphémères activés" : "Messages éphémères désactivés");
}

async function toggleBlock(otherUidVal) {
  const blocked = (myProfile.blockedUsers || []).includes(otherUidVal);
  await db.collection("users").doc(currentUser.uid).update({
    blockedUsers: blocked
      ? firebase.firestore.FieldValue.arrayRemove(otherUidVal)
      : firebase.firestore.FieldValue.arrayUnion(otherUidVal)
  });
  closeModal();
  showToast(blocked ? "Contact débloqué" : "Contact bloqué");
}

// ---------- Modales génériques ----------
function showModal(html) {
  const overlay = document.getElementById("modalOverlay");
  document.getElementById("modalSheet").innerHTML = html;
  overlay.classList.remove("hidden");
}
function closeModal() {
  document.getElementById("modalOverlay").classList.add("hidden");
}

// ---------- Menu (⋮) ----------
function openMenu() {
  showModal(`
    <h3>Menu</h3>
    <button class="primary" style="margin-bottom:8px" onclick="openNewGroupModal()">Nouveau groupe</button>
    <button class="primary" style="margin-bottom:8px;background:#555" onclick="openPrivacySettings()">Confidentialité</button>
    <button class="primary" style="margin-bottom:8px;background:#555" onclick="closeModal()">Appareils connectés</button>
    <button class="primary" style="background:#e74c3c" onclick="logout()">Se déconnecter</button>
  `);
}

function openPrivacySettings() {
  const hideLastSeen = myProfile.lastSeenVisible === false;
  showModal(`
    <h3>Confidentialité</h3>
    <label style="display:flex;align-items:center;gap:10px;margin:14px 0">
      <input type="checkbox" id="hideLastSeenCheck" ${hideLastSeen ? "checked" : ""}>
      Masquer ma dernière connexion
    </label>
    <button class="primary" onclick="savePrivacy()">Enregistrer</button>
  `);
}

async function savePrivacy() {
  const hide = document.getElementById("hideLastSeenCheck").checked;
  await db.collection("users").doc(currentUser.uid).update({ lastSeenVisible: !hide });
  closeModal();
  showToast("Préférences enregistrées");
}

function logout() {
  closeModal();
  if (currentUser) {
    db.collection("users").doc(currentUser.uid).update({ online: false }).catch(() => {});
  }
  auth.signOut();
}
</script>

<script>
// ============================================================
// KUMA — Écran de conversation : messages temps réel, notes vocales,
// réactions, réponses, transfert, modification/suppression, épinglage,
// accusés de lecture (✓✓ bleus) et indicateur "en train d'écrire..."
// ============================================================

let activeChatId = null;
let activeChat = null;
let msgsUnsub = null;
let chatDocUnsub = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordingStartTime = null;
let replyingTo = null;          // { id, text, senderName }
let typingClearTimer = null;
let lastTypingWrite = 0;
const REACTIONS = ["❤️", "😂", "😮", "😢", "🙏", "👍"];

function openChat(chatId) {
  activeChatId = chatId;
  replyingTo = null;
  renderReplyBar();
  activeChat = allChats.find(c => c.id === chatId);
  const otherName = activeChat ? chatDisplayName(activeChat, currentUser.uid) : "Discussion";
  document.getElementById("chatHeaderName").textContent = otherName || "Discussion";
  document.getElementById("chatScreen").classList.remove("hidden");
  document.getElementById("messagesList").innerHTML = "";
  updateChatHeaderStatus();

  db.collection("chats").doc(chatId).update({ [`unread.${currentUser.uid}`]: 0 }).catch(() => {});

  if (msgsUnsub) msgsUnsub();
  msgsUnsub = db.collection("chats").doc(chatId).collection("messages")
    .orderBy("createdAt", "asc")
    .limitToLast(200)
    .onSnapshot((snap) => {
      const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderMessages(msgs);
      markDeliveredAndRead(msgs);
    }, (err) => console.error("Erreur messages:", err));

  if (chatDocUnsub) chatDocUnsub();
  chatDocUnsub = db.collection("chats").doc(chatId).onSnapshot((snap) => {
    activeChat = { id: snap.id, ...snap.data() };
    const idx = allChats.findIndex(c => c.id === chatId);
    if (idx >= 0) allChats[idx] = activeChat;
    updateChatHeaderStatus();
    renderPinnedBanner();
  });
}

function closeChat() {
  document.getElementById("chatScreen").classList.add("hidden");
  if (msgsUnsub) msgsUnsub();
  if (chatDocUnsub) chatDocUnsub();
  clearTypingState();
  activeChatId = null;
  activeChat = null;
}

// Helper posé sur les objets chat (utilisé aussi plus haut)
function chatDisplayName(chat, myUid) {
  return chat.isGroup ? chat.name : (chat.namesByUid ? chat.namesByUid[chat.members.find(u => u !== myUid)] : "Contact");
}

function updateChatHeaderStatus() {
  if (!activeChat) return;
  const el = document.getElementById("chatHeaderStatus");
  const typing = activeChat.typing || {};
  const now = Date.now();
  const someoneTyping = Object.entries(typing).some(([uid, ts]) => uid !== currentUser.uid && ts && (now - ts.toMillis()) < 6000);

  if (someoneTyping) {
    el.textContent = "en train d'écrire...";
    el.style.fontStyle = "italic";
    return;
  }
  el.style.fontStyle = "normal";
  if (activeChat.isGroup) {
    el.textContent = `${activeChat.members.length} membres`;
    return;
  }
  const otherUid = activeChat.members.find(u => u !== currentUser.uid);
  const otherUser = allUsers.find(u => u.uid === otherUid);
  if (otherUser && otherUser.online) {
    el.textContent = "en ligne";
  } else if (otherUser && otherUser.lastSeen && (otherUser.lastSeenVisible !== false)) {
    el.textContent = "vu(e) à " + otherUser.lastSeen.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } else {
    el.textContent = "";
  }
}

// ---------- Épinglage ----------
function renderPinnedBanner() {
  const banner = document.getElementById("pinnedBanner");
  const pinnedId = (activeChat.pinnedMessageIds || [])[0];
  if (!pinnedId) { banner.classList.add("hidden"); return; }
  db.collection("chats").doc(activeChatId).collection("messages").doc(pinnedId).get().then((doc) => {
    if (!doc.exists) { banner.classList.add("hidden"); return; }
    const m = doc.data();
    banner.classList.remove("hidden");
    banner.innerHTML = `📌 <span>${escapeHtml(m.text || messagePreview(m))}</span>`;
  });
}

async function togglePin(messageId) {
  const current = activeChat.pinnedMessageIds || [];
  const next = current.includes(messageId) ? [] : [messageId];
  await db.collection("chats").doc(activeChatId).update({ pinnedMessageIds: next });
}

// ---------- Rendu des messages ----------
function messagePreview(m) {
  if (m.deleted) return "Message supprimé";
  if (m.type === "voice") return "🎤 Note vocale";
  if (m.type === "image") return "📷 Photo";
  return m.text || "";
}

function renderMessages(msgs) {
  const list = document.getElementById("messagesList");
  list.innerHTML = msgs.map(m => {
    const out = m.senderId === currentUser.uid;
    const time = m.createdAt ? m.createdAt.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
    let body;

    if (m.deleted) {
      body = `<em style="color:var(--kuma-muted)">Message supprimé</em>`;
    } else if (m.type === "text") {
      body = escapeHtml(m.text) + (m.edited ? ` <span style="font-size:10px;color:var(--kuma-muted)">(modifié)</span>` : "");
    } else if (m.type === "voice") {
      body = `<audio controls preload="none" src="${m.mediaUrl}"></audio>`;
    } else if (m.type === "image") {
      body = `<img src="${m.mediaUrl}" style="border-radius:8px;max-width:200px">`;
    }

    const replyHtml = m.replyTo ? `
      <div style="border-left:3px solid var(--kuma-green);padding:4px 8px;margin-bottom:4px;background:rgba(0,0,0,.04);border-radius:4px;font-size:12.5px">
        <div style="font-weight:600;color:var(--kuma-green)">${escapeHtml(m.replyTo.senderName)}</div>
        <div style="color:var(--kuma-muted)">${escapeHtml(m.replyTo.text)}</div>
      </div>` : "";

    const reactions = m.reactions || {};
    const grouped = {};
    Object.values(reactions).forEach(emoji => { grouped[emoji] = (grouped[emoji] || 0) + 1; });
    const reactionsHtml = Object.keys(grouped).length ? `
      <div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">
        ${Object.entries(grouped).map(([e, c]) => `<span style="background:#fff;border-radius:10px;padding:1px 6px;font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,.15)">${e} ${c > 1 ? c : ""}</span>`).join("")}
      </div>` : "";

    const ticks = out && !m.deleted ? renderTicks(m) : "";

    return `
      <div class="msg ${out ? "out" : "in"}" data-msg-id="${m.id}" onclick="openMessageActions('${m.id}')">
        ${replyHtml}
        ${body}
        ${reactionsHtml}
        <span class="msg-time">${time} ${ticks}</span>
      </div>`;
  }).join("");
  list.scrollTop = list.scrollHeight;
}

function renderTicks(m) {
  const otherMembers = (activeChat.members || []).filter(u => u !== currentUser.uid);
  const readByOthers = otherMembers.every(u => (m.readBy || []).includes(u));
  const deliveredToOthers = otherMembers.every(u => (m.deliveredTo || []).includes(u));
  if (readByOthers && otherMembers.length > 0) return `<span style="color:#53bdeb">✓✓</span>`;
  if (deliveredToOthers && otherMembers.length > 0) return `<span>✓✓</span>`;
  return `<span>✓</span>`;
}

// ---------- Accusés de réception / lecture ----------
async function markDeliveredAndRead(msgs) {
  const batch = db.batch();
  let hasWrites = false;
  msgs.forEach(m => {
    if (m.senderId === currentUser.uid) return;
    const ref = db.collection("chats").doc(activeChatId).collection("messages").doc(m.id);
    const delivered = m.deliveredTo || [];
    const read = m.readBy || [];
    const updates = {};
    if (!delivered.includes(currentUser.uid)) updates.deliveredTo = firebase.firestore.FieldValue.arrayUnion(currentUser.uid);
    if (!read.includes(currentUser.uid)) updates.readBy = firebase.firestore.FieldValue.arrayUnion(currentUser.uid);
    if (Object.keys(updates).length) { batch.update(ref, updates); hasWrites = true; }
  });
  if (hasWrites) batch.commit().catch(() => {});
}

// ---------- "En train d'écrire..." ----------
function notifyTyping() {
  const now = Date.now();
  if (now - lastTypingWrite > 2000) {
    lastTypingWrite = now;
    db.collection("chats").doc(activeChatId).update({
      [`typing.${currentUser.uid}`]: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {});
  }
  clearTimeout(typingClearTimer);
  typingClearTimer = setTimeout(clearTypingState, 3000);
}

function clearTypingState() {
  if (!activeChatId) return;
  db.collection("chats").doc(activeChatId).update({ [`typing.${currentUser.uid}`]: null }).catch(() => {});
}

// ---------- Envoi de texte ----------
async function sendTextMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text || !activeChatId) return;
  input.value = "";
  clearTypingState();
  const extra = replyingTo ? { replyTo: replyingTo } : {};
  await pushMessage({ type: "text", text, ...extra });
  replyingTo = null;
  renderReplyBar();
}

async function pushMessage(payload) {
  const chat = activeChat;
  if (!chat.isGroup) {
    const other = chat.members.find(u => u !== currentUser.uid);
    if (isBlockedPair(currentUser.uid, other)) {
      showToast("Vous ne pouvez pas envoyer de message à ce contact");
      return;
    }
  }
  const msgRef = db.collection("chats").doc(activeChatId).collection("messages").doc();
  await msgRef.set({
    ...payload,
    senderId: currentUser.uid,
    deliveredTo: [],
    readBy: [],
    reactions: {},
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  const unreadUpdates = {};
  (chat.members || []).forEach(uid => {
    if (uid !== currentUser.uid) unreadUpdates[`unread.${uid}`] = firebase.firestore.FieldValue.increment(1);
  });

  await db.collection("chats").doc(activeChatId).update({
    lastMessage: messagePreview(payload),
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    ...unreadUpdates
  });

  maybeScheduleExpiry(msgRef.id);
}

// ---------- Messages éphémères ----------
function maybeScheduleExpiry(messageId) {
  const duration = activeChat && activeChat.disappearingDuration;
  if (!duration) return;
  db.collection("chats").doc(activeChatId).collection("messages").doc(messageId).update({
    expiresAt: firebase.firestore.Timestamp.fromMillis(Date.now() + duration * 1000)
  }).catch(() => {});
  // Suppression best-effort côté client (sans Cloud Function de nettoyage serveur)
  setTimeout(() => {
    db.collection("chats").doc(activeChatId).collection("messages").doc(messageId)
      .update({ deleted: true, text: "", mediaUrl: "" }).catch(() => {});
  }, duration * 1000);
}

// ---------- Réponse / Réactions / Transfert / Modifier / Supprimer / Épingler ----------
function setReplyTarget(messageId, senderName, text) {
  replyingTo = { id: messageId, senderName, text: text.slice(0, 120) };
  renderReplyBar();
  document.getElementById("messageInput").focus();
}

function renderReplyBar() {
  const bar = document.getElementById("replyBar");
  if (!replyingTo) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  bar.innerHTML = `
    <div style="flex:1;overflow:hidden">
      <div style="font-weight:600;color:var(--kuma-green);font-size:12px">Réponse à ${escapeHtml(replyingTo.senderName)}</div>
      <div style="font-size:12px;color:var(--kuma-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(replyingTo.text)}</div>
    </div>
    <button onclick="cancelReply()" style="background:none;border:none;font-size:16px">✕</button>`;
}
function cancelReply() { replyingTo = null; renderReplyBar(); }

function openMessageActions(messageId) {
  db.collection("chats").doc(activeChatId).collection("messages").doc(messageId).get().then((doc) => {
    if (!doc.exists) return;
    const m = doc.data();
    const mine = m.senderId === currentUser.uid;
    const senderName = mine ? "Moi" : chatDisplayName(activeChat, currentUser.uid);

    const reactionsRow = REACTIONS.map(e => `<button onclick="reactToMessage('${messageId}','${e}')" style="font-size:22px;background:none;border:none">${e}</button>`).join("");

    showModal(`
      <div style="display:flex;justify-content:space-around;margin-bottom:14px">${reactionsRow}</div>
      <button class="primary" style="background:#555;margin-bottom:8px" onclick="closeModal();setReplyTarget('${messageId}','${escapeHtml(senderName)}','${escapeHtml((m.text || messagePreview(m)).replace(/'/g, "\\'"))}')">↩ Répondre</button>
      <button class="primary" style="background:#555;margin-bottom:8px" onclick="openForwardPicker('${messageId}')">➡ Transférer</button>
      <button class="primary" style="background:#555;margin-bottom:8px" onclick="togglePin('${messageId}');closeModal()">📌 ${(activeChat.pinnedMessageIds||[]).includes(messageId) ? "Désépingler" : "Épingler"}</button>
      ${mine && m.type === "text" && !m.deleted ? `<button class="primary" style="background:#555;margin-bottom:8px" onclick="startEditMessage('${messageId}', '${escapeHtml(m.text).replace(/'/g, "\\'")}')">✏ Modifier</button>` : ""}
      ${mine && !m.deleted ? `<button class="primary" style="background:#e74c3c" onclick="deleteMessage('${messageId}')">🗑 Supprimer</button>` : ""}
    `);
  });
}

async function reactToMessage(messageId, emoji) {
  closeModal();
  await db.collection("chats").doc(activeChatId).collection("messages").doc(messageId)
    .update({ [`reactions.${currentUser.uid}`]: emoji });
}

function startEditMessage(messageId, currentText) {
  closeModal();
  const input = document.getElementById("messageInput");
  input.value = currentText;
  input.focus();
  input.dataset.editingId = messageId;
  document.getElementById("sendBtn").dataset.editing = "1";
}

async function saveEditIfAny() {
  const input = document.getElementById("messageInput");
  const editingId = input.dataset.editingId;
  if (!editingId) return false;
  const newText = input.value.trim();
  delete input.dataset.editingId;
  document.getElementById("sendBtn").dataset.editing = "";
  if (!newText) return true;
  await db.collection("chats").doc(activeChatId).collection("messages").doc(editingId)
    .update({ text: newText, edited: true });
  input.value = "";
  return true;
}

async function deleteMessage(messageId) {
  closeModal();
  await db.collection("chats").doc(activeChatId).collection("messages").doc(messageId)
    .update({ deleted: true, text: "", mediaUrl: "" });
}

function openForwardPicker(messageId) {
  db.collection("chats").doc(activeChatId).collection("messages").doc(messageId).get().then((doc) => {
    const m = doc.data();
    const list = allChats.map(c => `
      <div class="contact-pick" onclick="forwardMessageTo('${c.id}', ${JSON.stringify(JSON.stringify(m)).replace(/"/g, "&quot;")})">
        <div class="avatar">${chatDisplayName(c, currentUser.uid).slice(0,2).toUpperCase()}</div>
        <div>${escapeHtml(chatDisplayName(c, currentUser.uid))}</div>
      </div>`).join("");
    showModal(`<h3>Transférer à...</h3>${list}`);
  });
}

async function forwardMessageTo(targetChatId, encodedMsgJson) {
  closeModal();
  const m = JSON.parse(encodedMsgJson.replace(/&quot;/g, '"'));
  const targetChat = allChats.find(c => c.id === targetChatId);
  const msgRef = db.collection("chats").doc(targetChatId).collection("messages").doc();
  await msgRef.set({
    type: m.type, text: m.text || "", mediaUrl: m.mediaUrl || "", durationMs: m.durationMs || 0,
    forwarded: true, senderId: currentUser.uid, deliveredTo: [], readBy: [], reactions: {},
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  await db.collection("chats").doc(targetChatId).update({
    lastMessage: messagePreview(m), lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  showToast("Message transféré");
}

// ---------- Notes vocales ----------
async function toggleVoiceRecording() {
  const btn = document.getElementById("voiceBtn");
  if (!mediaRecorder || mediaRecorder.state === "inactive") {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
      mediaRecorder.onstop = uploadVoiceNote;
      mediaRecorder.start();
      recordingStartTime = Date.now();
      btn.classList.add("recording");
      btn.textContent = "⏹";
    } catch (err) {
      showToast("Micro inaccessible : " + err.message);
    }
  } else {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
    btn.classList.remove("recording");
    btn.textContent = "🎤";
  }
}

async function uploadVoiceNote() {
  const durationMs = Date.now() - recordingStartTime;
  if (durationMs < 500) return;
  const blob = new Blob(recordedChunks, { type: "audio/webm" });
  const path = `voice/${activeChatId}/${Date.now()}_${currentUser.uid}.webm`;
  const ref = storage.ref(path);
  await ref.put(blob);
  const url = await ref.getDownloadURL();
  await pushMessage({ type: "voice", mediaUrl: url, durationMs });
}

// ---------- Photo ----------
function pickImage() { document.getElementById("imageInput").click(); }
async function onImageSelected(e) {
  const file = e.target.files[0];
  if (!file || !activeChatId) return;
  const path = `images/${activeChatId}/${Date.now()}_${currentUser.uid}_${file.name}`;
  const ref = storage.ref(path);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await pushMessage({ type: "image", mediaUrl: url });
  e.target.value = "";
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("backBtn").addEventListener("click", closeChat);
  document.getElementById("sendBtn").addEventListener("click", async () => {
    const wasEditing = await saveEditIfAny();
    if (!wasEditing) sendTextMessage();
  });
  document.getElementById("messageInput").addEventListener("input", () => { if (activeChatId) notifyTyping(); });
  document.getElementById("messageInput").addEventListener("keypress", async (e) => {
    if (e.key === "Enter") {
      const wasEditing = await saveEditIfAny();
      if (!wasEditing) sendTextMessage();
    }
  });
  document.getElementById("voiceBtn").addEventListener("click", toggleVoiceRecording);
  document.getElementById("attachBtn").addEventListener("click", pickImage);
  document.getElementById("imageInput").addEventListener("change", onImageSelected);
});
</script>

<script>
// ============================================================
// KUMA — Statuts éphémères (24h), comme les Stories WhatsApp
// ============================================================

function initStatusTab() {
  db.collection("statuses")
    .where("expiresAt", ">", firebase.firestore.Timestamp.now())
    .orderBy("expiresAt", "desc")
    .onSnapshot((snap) => {
      const statuses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderStatusTab(statuses);
    }, (err) => console.error("Erreur statuts:", err));
}

function renderStatusTab(statuses) {
  const mine = statuses.filter(s => s.userId === currentUser.uid);
  const others = statuses.filter(s => s.userId !== currentUser.uid);

  // Regrouper par utilisateur
  const byUser = {};
  others.forEach(s => {
    byUser[s.userId] = byUser[s.userId] || { name: s.userName, items: [] };
    byUser[s.userId].items.push(s);
  });

  const myItem = `
    <div class="status-list-item" onclick="openAddStatus()">
      <div class="status-ring seen"><div class="avatar">${(currentUser.displayName || "Moi").slice(0,2).toUpperCase()}</div></div>
      <div>
        <div style="font-weight:600">Mon statut</div>
        <div style="font-size:12px;color:var(--kuma-muted)">${mine.length > 0 ? mine.length + " statut(s) actif(s)" : "Touchez pour ajouter un statut"}</div>
      </div>
    </div>`;

  const recentHtml = Object.entries(byUser).map(([uid, u]) => `
    <div class="status-list-item" onclick="viewStatuses('${uid}')">
      <div class="status-ring"><div class="avatar">${(u.name || "?").slice(0,2).toUpperCase()}</div></div>
      <div>
        <div style="font-weight:600">${escapeHtml(u.name || "Contact")}</div>
        <div style="font-size:12px;color:var(--kuma-muted)">${u.items.length} statut(s)</div>
      </div>
    </div>`).join("");

  document.getElementById("statusTabContent").innerHTML = `
    ${myItem}
    <div class="section-label">Récents</div>
    ${recentHtml || '<div class="empty-state">Aucun statut récent parmi vos contacts.</div>'}
  `;
}

function openAddStatus() {
  showModal(`
    <h3>Ajouter un statut</h3>
    <input type="text" id="statusTextInput" placeholder="Écrivez quelque chose...">
    <input type="file" id="statusImageInput" accept="image/*" style="margin-bottom:12px">
    <button class="primary" onclick="publishStatus()">Publier (visible 24h)</button>
  `);
}

async function publishStatus() {
  const text = document.getElementById("statusTextInput").value.trim();
  const file = document.getElementById("statusImageInput").files[0];
  let mediaUrl = "";
  if (file) {
    const path = `status/${currentUser.uid}/${Date.now()}_${file.name}`;
    const ref = storage.ref(path);
    await ref.put(file);
    mediaUrl = await ref.getDownloadURL();
  }
  const now = new Date();
  const expires = new Date(now.getTime() + 24 * 3600 * 1000);
  await db.collection("statuses").add({
    userId: currentUser.uid,
    userName: currentUser.displayName || "Moi",
    text,
    mediaUrl,
    createdAt: firebase.firestore.Timestamp.fromDate(now),
    expiresAt: firebase.firestore.Timestamp.fromDate(expires),
    viewedBy: []
  });
  closeModal();
  showToast("Statut publié pour 24h");
}

function viewStatuses(uid) {
  db.collection("statuses").where("userId", "==", uid).get().then((snap) => {
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    items.forEach(it => {
      db.collection("statuses").doc(it.id).update({
        viewedBy: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
      }).catch(() => {});
    });
    const slides = items.map(it => `
      <div style="margin-bottom:16px">
        ${it.mediaUrl ? `<img src="${it.mediaUrl}" style="width:100%;border-radius:8px;margin-bottom:6px">` : ""}
        <div>${escapeHtml(it.text || "")}</div>
      </div>`).join("");
    showModal(`<h3>Statuts</h3>${slides}`);
  });
}
</script>

<script>
// ============================================================
// KUMA — Appels audio/vidéo temps réel : 1-à-1 (offre/réponse classique)
// et appels de groupe (maillage WebRTC "mesh", chaque participant connecté
// à tous les autres), signalisation via Firestore.
// NB : nécessite un serveur TURN pour fonctionner hors réseau local (voir
// la configuration RTC_CONFIG tout en haut de ce fichier)
// ============================================================

let pc = null;                 // PeerConnection pour un appel 1-à-1
let localStream = null;
let currentCallId = null;
let callsUnsub = null;
let isGroupCallActive = false;

// ---------- Appels de groupe : état ----------
const groupPeerConnections = {};   // { uid: RTCPeerConnection }
const groupRemoteStreams = {};     // { uid: MediaStream }
let groupPeersUnsub = null;
let groupSignalsUnsub = null;
let groupCallId = null;

function initCallsTab() {
  callsUnsub = db.collection("calls")
    .where("participants", "array-contains", currentUser.uid)
    .orderBy("startedAt", "desc")
    .limit(50)
    .onSnapshot((snap) => {
      renderCallsTab(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, (err) => console.error("Erreur historique appels:", err));

  // Appels 1-à-1 entrants
  db.collection("calls")
    .where("calleeId", "==", currentUser.uid)
    .where("status", "==", "ringing")
    .onSnapshot((snap) => {
      snap.docChanges().forEach((change) => {
        if (change.type === "added") showIncomingCall({ id: change.doc.id, ...change.doc.data() });
      });
    });

  // Appels de groupe entrants (discussions de groupe dont je suis membre)
  db.collection("calls")
    .where("isGroup", "==", true)
    .where("status", "==", "active")
    .onSnapshot((snap) => {
      snap.docChanges().forEach((change) => {
        const data = change.doc.data();
        if (change.type === "added" && (data.chatMembers || []).includes(currentUser.uid) && !isGroupCallActive) {
          showIncomingGroupCall({ id: change.doc.id, ...data });
        }
      });
    });
}

function renderCallsTab(calls) {
  const container = document.getElementById("callsTabContent");
  if (calls.length === 0) {
    container.innerHTML = `<div class="empty-state">Aucun appel récent.</div>`;
    return;
  }
  container.innerHTML = calls.map(c => {
    const missed = c.status === "missed";
    const icon = c.video ? "🎥" : "📞";
    const groupTag = c.isGroup ? " · groupe" : "";
    const dir = c.callerId === currentUser.uid ? "↗" : "↙";
    const otherName = c.isGroup ? (c.chatName || "Appel de groupe") : (c.callerId === currentUser.uid ? c.calleeName : c.callerName);
    const time = c.startedAt ? c.startedAt.toDate().toLocaleString([], { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
    return `
      <div class="call-item">
        <div class="avatar">${(otherName||"?").slice(0,2).toUpperCase()}</div>
        <div style="flex:1">
          <div style="font-weight:600">${escapeHtml(otherName || "Contact")}</div>
          <div class="call-icon ${missed ? "missed" : ""}">${dir} ${icon}${groupTag} ${time}</div>
        </div>
      </div>`;
  }).join("");
}

// Point d'entrée depuis l'en-tête d'une discussion (1-à-1 ou groupe)
function callFromChatHeader(video) {
  if (!activeChat) return;
  if (activeChat.isGroup) {
    startOrJoinGroupCall(activeChatId, activeChat.name, activeChat.members, video);
  } else {
    const uid = activeChat.members.find(u => u !== currentUser.uid);
    const name = activeChat.namesByUid ? activeChat.namesByUid[uid] : "Contact";
    startCall(uid, name, video);
  }
}

// ==================================================================
// APPELS 1-À-1
// ==================================================================
async function startCall(calleeUid, calleeName, video) {
  currentCallId = db.collection("calls").doc().id;
  pc = new RTCPeerConnection(RTC_CONFIG);
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  showCallScreen(calleeName, video, true);

  const remoteStream = new MediaStream();
  document.getElementById("remoteVideo").srcObject = remoteStream;
  pc.ontrack = (e) => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

  const callDoc = db.collection("calls").doc(currentCallId);
  const offerCandidates = callDoc.collection("offerCandidates");
  const answerCandidates = callDoc.collection("answerCandidates");

  pc.onicecandidate = (e) => { if (e.candidate) offerCandidates.add(e.candidate.toJSON()); };

  const offerDescription = await pc.createOffer();
  await pc.setLocalDescription(offerDescription);

  await callDoc.set({
    isGroup: false,
    callerId: currentUser.uid,
    callerName: currentUser.displayName || myProfile.name || "Moi",
    calleeId: calleeUid,
    calleeName,
    video,
    status: "ringing",
    participants: [currentUser.uid, calleeUid],
    startedAt: firebase.firestore.FieldValue.serverTimestamp(),
    offer: { type: offerDescription.type, sdp: offerDescription.sdp }
  });

  callDoc.onSnapshot((snap) => {
    const data = snap.data();
    if (data && data.answer && pc.currentRemoteDescription === null) {
      pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
    if (data && (data.status === "ended" || data.status === "declined")) endCall(false);
  });

  answerCandidates.onSnapshot((snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
    });
  });
}

function showIncomingCall(call) {
  currentCallId = call.id;
  showModal(`
    <h3>${call.video ? "📹" : "📞"} Appel entrant</h3>
    <p>${escapeHtml(call.callerName)} vous appelle...</p>
    <button class="primary" style="background:var(--kuma-accent)" onclick="answerCall('${call.id}', ${!!call.video})">Répondre</button>
    <button class="primary" style="background:#e74c3c;margin-top:8px" onclick="declineCall('${call.id}')">Refuser</button>
  `);
}

async function answerCall(callId, video) {
  closeModal();
  const callDoc = db.collection("calls").doc(callId);
  const callSnap = await callDoc.get();
  const callData = callSnap.data();

  pc = new RTCPeerConnection(RTC_CONFIG);
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  showCallScreen(callData.callerName, video, false);

  const remoteStream = new MediaStream();
  document.getElementById("remoteVideo").srcObject = remoteStream;
  pc.ontrack = (e) => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

  const offerCandidates = callDoc.collection("offerCandidates");
  const answerCandidates = callDoc.collection("answerCandidates");
  pc.onicecandidate = (e) => { if (e.candidate) answerCandidates.add(e.candidate.toJSON()); };

  await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
  const answerDescription = await pc.createAnswer();
  await pc.setLocalDescription(answerDescription);

  await callDoc.update({
    status: "active",
    answer: { type: answerDescription.type, sdp: answerDescription.sdp }
  });

  offerCandidates.onSnapshot((snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
    });
  });

  callDoc.onSnapshot((snap) => {
    const data = snap.data();
    if (data && data.status === "ended") endCall(false);
  });
}

function declineCall(callId) {
  closeModal();
  db.collection("calls").doc(callId).update({ status: "declined" });
}

function showCallScreen(name, video, isCaller) {
  document.getElementById("callPeerName").textContent = name;
  document.getElementById("callScreen").classList.remove("hidden");
  document.getElementById("callGrid").classList.add("hidden");
  document.getElementById("localVideo").classList.toggle("hidden", !video);
  document.getElementById("remoteVideo").classList.toggle("hidden", !video);
  document.getElementById("callPeerAvatarWrap").classList.toggle("hidden", video);
  if (video && localStream) document.getElementById("localVideo").srcObject = localStream;
}

async function endCall(updateFirestore = true) {
  if (updateFirestore && currentCallId) {
    db.collection("calls").doc(currentCallId).update({ status: "ended" }).catch(() => {});
  }
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.getElementById("callScreen").classList.add("hidden");
  currentCallId = null;
  if (isGroupCallActive) leaveGroupCall();
}

// ==================================================================
// APPELS DE GROUPE (mesh WebRTC)
// ==================================================================
async function startOrJoinGroupCall(chatId, chatName, chatMembers, video) {
  // Un seul appel de groupe actif à la fois par discussion : on le retrouve ou on le crée
  const existing = await db.collection("calls")
    .where("chatId", "==", chatId).where("status", "==", "active").limit(1).get();

  groupCallId = existing.empty ? db.collection("calls").doc().id : existing.docs[0].id;
  isGroupCallActive = true;
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video });

  showGroupCallScreen(chatName, video);

  const callDoc = db.collection("calls").doc(groupCallId);
  if (existing.empty) {
    await callDoc.set({
      isGroup: true,
      chatId,
      chatName,
      chatMembers,
      video,
      status: "active",
      callerId: currentUser.uid,
      participants: [currentUser.uid],
      startedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } else {
    await callDoc.update({ participants: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
  }

  const myJoinedAt = Date.now();
  const peersCol = callDoc.collection("peers");
  await peersCol.doc(currentUser.uid).set({
    name: currentUser.displayName || myProfile.name || "Moi",
    joinedAtClient: myJoinedAt,
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  // Se connecter aux participants déjà présents (je leur envoie une offre)
  const existingPeers = await peersCol.get();
  existingPeers.docs.forEach((doc) => {
    if (doc.id !== currentUser.uid) createGroupConnection(doc.id, true, video);
  });

  // Nouveaux participants qui rejoignent après moi : j'écoute et j'accepte leur offre
  groupPeersUnsub = peersCol.onSnapshot((snap) => {
    snap.docChanges().forEach((change) => {
      const uid = change.doc.id;
      if (change.type === "removed" && groupPeerConnections[uid]) {
        closeGroupConnection(uid);
      }
    });
    renderGroupTiles();
  });

  listenGroupSignals(groupCallId, video);
}

function createGroupConnection(remoteUid, isInitiator, video) {
  const connection = new RTCPeerConnection(RTC_CONFIG);
  groupPeerConnections[remoteUid] = connection;
  localStream.getTracks().forEach(t => connection.addTrack(t, localStream));

  const remoteStream = new MediaStream();
  groupRemoteStreams[remoteUid] = remoteStream;
  connection.ontrack = (e) => { e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t)); renderGroupTiles(); };

  const pairId = isInitiator ? `${currentUser.uid}_${remoteUid}` : `${remoteUid}_${currentUser.uid}`;
  const signalDoc = db.collection("calls").doc(groupCallId).collection("signals").doc(pairId);
  const candidatesCol = signalDoc.collection(isInitiator ? "offerCandidates" : "answerCandidates");
  connection.onicecandidate = (e) => { if (e.candidate) candidatesCol.add(e.candidate.toJSON()); };

  if (isInitiator) {
    connection.createOffer().then(async (offer) => {
      await connection.setLocalDescription(offer);
      await signalDoc.set({ offer: { type: offer.type, sdp: offer.sdp }, from: currentUser.uid, to: remoteUid });
      signalDoc.onSnapshot((snap) => {
        const data = snap.data();
        if (data && data.answer && connection.currentRemoteDescription === null) {
          connection.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
      });
      signalDoc.collection("answerCandidates").onSnapshot((snap) => {
        snap.docChanges().forEach((c) => { if (c.type === "added") connection.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
      });
    });
  }

  renderGroupTiles();
  return connection;
}

function listenGroupSignals(callId, video) {
  groupSignalsUnsub = db.collection("calls").doc(callId).collection("signals").onSnapshot((snap) => {
    snap.docChanges().forEach(async (change) => {
      const data = change.doc.data();
      if (!data || data.to !== currentUser.uid) return;
      const remoteUid = data.from;
      if (change.type === "added" && !groupPeerConnections[remoteUid]) {
        const connection = createGroupConnection(remoteUid, false, video);
        await connection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await connection.createAnswer();
        await connection.setLocalDescription(answer);
        await change.doc.ref.update({ answer: { type: answer.type, sdp: answer.sdp } });
        change.doc.ref.collection("offerCandidates").onSnapshot((s2) => {
          s2.docChanges().forEach((c) => { if (c.type === "added") connection.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
        });
      }
    });
  });
}

function closeGroupConnection(uid) {
  if (groupPeerConnections[uid]) { groupPeerConnections[uid].close(); delete groupPeerConnections[uid]; }
  delete groupRemoteStreams[uid];
  renderGroupTiles();
}

function showIncomingGroupCall(call) {
  showModal(`
    <h3>👥 Appel de groupe</h3>
    <p>Un appel de groupe est en cours dans "${escapeHtml(call.chatName || "une discussion")}"</p>
    <button class="primary" style="background:var(--kuma-accent)" onclick="closeModal();startOrJoinGroupCall('${call.chatId}','${escapeHtml(call.chatName||"")}', ${JSON.stringify(call.chatMembers)}, ${!!call.video})">Rejoindre</button>
    <button class="primary" style="background:#555;margin-top:8px" onclick="closeModal()">Ignorer</button>
  `);
}

function showGroupCallScreen(chatName, video) {
  document.getElementById("callPeerName").textContent = chatName;
  document.getElementById("callScreen").classList.remove("hidden");
  document.getElementById("callGrid").classList.remove("hidden");
  document.getElementById("localVideo").classList.add("hidden");
  document.getElementById("remoteVideo").classList.add("hidden");
  document.getElementById("callPeerAvatarWrap").classList.add("hidden");
  renderGroupTiles();
}

function renderGroupTiles() {
  const grid = document.getElementById("callGrid");
  if (!grid) return;
  const tiles = Object.entries(groupRemoteStreams).map(([uid, stream]) => {
    const name = (allUsers.find(u => u.uid === uid) || {}).name || "Participant";
    return `<div class="call-tile"><video autoplay playsinline data-uid="${uid}"></video><span>${escapeHtml(name)}</span></div>`;
  }).join("");
  grid.innerHTML = tiles || `<div style="color:#ccc;padding:20px">En attente des autres participants...</div>`;
  Object.entries(groupRemoteStreams).forEach(([uid, stream]) => {
    const v = grid.querySelector(`video[data-uid="${uid}"]`);
    if (v) v.srcObject = stream;
  });
}

function leaveGroupCall() {
  if (groupCallId) {
    db.collection("calls").doc(groupCallId).collection("peers").doc(currentUser.uid).delete().catch(() => {});
    db.collection("calls").doc(groupCallId).update({
      participants: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
    }).catch(() => {});
  }
  Object.keys(groupPeerConnections).forEach(closeGroupConnection);
  if (groupPeersUnsub) groupPeersUnsub();
  if (groupSignalsUnsub) groupSignalsUnsub();
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  isGroupCallActive = false;
  groupCallId = null;
  document.getElementById("callScreen").classList.add("hidden");
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("endCallBtn").addEventListener("click", () => endCall(true));
});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(console.error);
  });
}
</script>
